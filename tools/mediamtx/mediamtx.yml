logLevel: info
logDestinations: [stdout]

readTimeout: 10s
writeTimeout: 10s
writeQueueSize: 512
udpMaxPayloadSize: 1472

authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
        path:
      - action: read
        path:
      - action: playback
        path:

api: yes
apiAddress: 0.0.0.0:9997

rtsp: yes
rtspAddress: :8554

webrtc: no
hls: no
rtmp: no

# Потоки annot_cam_* публикует backend (FFmpeg), читает go2rtc
pathDefaults:
  source: publisher
  overridePublisher: yes

paths:
  all_others:
