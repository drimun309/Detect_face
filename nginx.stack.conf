worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    charset       utf-8;
    sendfile      on;
    keepalive_timeout 65;
    # регистрация лиц: несколько фото/видео (по умолчанию nginx = 1m → 413)
    client_max_body_size 500m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://frontend:80;
            proxy_http_version 1.1;
            add_header Cache-Control "no-store";
        }

        location /api/ {
            proxy_pass http://backend:7030/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_read_timeout 3600s;
            client_max_body_size 500m;
        }

        # go2rtc WebSocket (Chrome чувствителен к буферизации)
        location /go2rtc/api/ws {
            proxy_pass http://go2rtc:1984/api/ws;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /go2rtc/ {
            proxy_pass http://go2rtc:1984/;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
